<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Left Petal: Vibrant Neon Pink (#FF4FA3 -> #EC4899) -->
    <linearGradient id="fav_pink" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#FF70BC"/>
      <stop offset="30%" stop-color="#FF4FA3"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>

    <!-- Center Petal: Rich Purple (#8B5CF6 -> #6D28D9) -->
    <linearGradient id="fav_purple" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE"/>
      <stop offset="25%" stop-color="#A855F7"/>
      <stop offset="65%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- Right Petal: Cyan to Electric Blue (#06B6D4 -> #2563EB) -->
    <linearGradient id="fav_cyan" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#06B6D4"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="fav_spec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Rim -->
    <linearGradient id="fav_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E0E7FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Floating Orbital Light Ring Gradients -->
    <linearGradient id="fav_orbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4FA3" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#A855F7" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="fav_orbit_back" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4FA3" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Neon Bloom Filter -->
    <filter id="fav_glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feGaussianBlur stdDeviation="5.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2" opacity="0.4"/>
        <feMergeNode in="blur1" opacity="0.7"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#fav_glow)">
    <!-- Back of Floating Orbital Ring -->
    <g transform="rotate(-18 50 56)">
      <path d="M 5 56 A 45 13 0 0 1 95 56" stroke="url(#fav_orbit_back)" stroke-width="1.2" stroke-dasharray="4 2" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Left Petal: Neon Pink (Creativity) -->
    <g transform="translate(50, 84) rotate(-34) translate(-50, -84)">
      <path d="M 48.5 24 C 49.3 23.1 50.7 23.1 51.5 24 C 55 28 62.5 43 62.5 59 C 62.5 73.5 55.5 82 50 84 C 44.5 82 37.5 73.5 37.5 59 C 37.5 43 45 28 48.5 24 Z" fill="url(#fav_pink)"/>
      <path d="M 48.5 24 C 49.3 23.1 50.7 23.1 51.5 24 C 55 28 62.5 43 62.5 59 C 62.5 73.5 55.5 82 50 84 C 44.5 82 37.5 73.5 37.5 59 C 37.5 43 45 28 48.5 24 Z" stroke="url(#fav_rim)" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M 49.5 26 C 49.8 25.5 50.2 25.5 50.5 26 C 52.8 30 58 43 58 57 C 58 66 54 74 50 78" stroke="url(#fav_spec)" stroke-width="1.3" stroke-linecap="round" opacity="0.6" fill="none"/>
    </g>

    <!-- Right Petal: Cyan to Electric Blue (Technology) -->
    <g transform="translate(50, 84) rotate(34) translate(-50, -84)">
      <path d="M 48.5 24 C 49.3 23.1 50.7 23.1 51.5 24 C 55 28 62.5 43 62.5 59 C 62.5 73.5 55.5 82 50 84 C 44.5 82 37.5 73.5 37.5 59 C 37.5 43 45 28 48.5 24 Z" fill="url(#fav_cyan)"/>
      <path d="M 48.5 24 C 49.3 23.1 50.7 23.1 51.5 24 C 55 28 62.5 43 62.5 59 C 62.5 73.5 55.5 82 50 84 C 44.5 82 37.5 73.5 37.5 59 C 37.5 43 45 28 48.5 24 Z" stroke="url(#fav_rim)" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M 49.5 26 C 49.8 25.5 50.2 25.5 50.5 26 C 52.8 30 58 43 58 57 C 58 66 54 74 50 78" stroke="url(#fav_spec)" stroke-width="1.3" stroke-linecap="round" opacity="0.6" fill="none"/>
    </g>

    <!-- Center Petal: Rich Purple (AI) -->
    <g>
      <path d="M 48.2 15 C 49.2 14 50.8 14 51.8 15 C 55.8 19.5 64 36 64 54.5 C 64 71 56.5 81.5 50 84 C 43.5 81.5 36 71 36 54.5 C 36 36 44.2 19.5 48.2 15 Z" fill="url(#fav_purple)"/>
      <path d="M 48.2 15 C 49.2 14 50.8 14 51.8 15 C 55.8 19.5 64 36 64 54.5 C 64 71 56.5 81.5 50 84 C 43.5 81.5 36 71 36 54.5 C 36 36 44.2 19.5 48.2 15 Z" stroke="url(#fav_rim)" stroke-width="0.8" fill="none" opacity="0.6"/>
      <path d="M 49.2 17 C 49.6 16.5 50.4 16.5 50.8 17 C 53.5 22 59.5 37 59.5 53 C 59.5 66 55 76 50 80" stroke="url(#fav_spec)" stroke-width="1.4" stroke-linecap="round" opacity="0.7" fill="none"/>
    </g>

    <!-- Front of Floating Orbital Ring -->
    <g transform="rotate(-18 50 56)">
      <path d="M 95 56 A 45 13 0 0 1 5 56" stroke="url(#fav_orbit)" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.9"/>
      <circle cx="92" cy="54" r="1.6" fill="#38BDF8" opacity="0.95"/>
      <circle cx="8" cy="58" r="1.4" fill="#FF70BC" opacity="0.9"/>
    </g>

    <!-- Ambient Micro-Particles -->
    <g opacity="0.85">
      <circle cx="16" cy="24" r="1.2" fill="#FF70BC"/>
      <circle cx="84" cy="26" r="1.2" fill="#38BDF8"/>
      <circle cx="50" cy="7" r="1" fill="#C084FC"/>
    </g>

    <!-- Center Convergence Seed -->
    <circle cx="50" cy="83.5" r="2.2" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
